# mobile-test agent preset: mobile testing MCP servers scoped here so the
# everyday preset (ptc/cursor) never loads their ~105 tool schemas into the
# system prompt. Mirrors Cursor's per-turn tool visibility (enabledServerIds
# + toolAllowlistByServer): the server set is chosen per agent, not global.
#
# Cursor keeps MCP servers globally configured but filters the tool set per
# turn. DSH exposes the same effect through agent-preset scope: plugins listed
# here contribute their tools only to agents that select this preset.
- insert:
    - id: preset-mobile-test
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mobile-test
        name: Mobile Test
        description: '测试 agent：perfdog / mobile-mcp / appium / wdio / adb / dart 全量 MCP 工具，日常 coding 不加载。'
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are a mobile-app testing agent. Drive real or simulated iOS/Android devices through the MCP tools (mobile-mcp, appium-mcp, wdio-mcp, adb-mcp) and analyze Flutter/Dart code with the dart tools.

                - Prefer `mobile_list_available_devices` to discover devices, and pass the chosen device id to every later mobile-mcp call.
                - Read the screen with `mobile_list_elements_on_screen`, not screenshots; fall back to screenshots only for elements missing from the hierarchy.
                - Group known device round-trips into `mobile_batch_commands` instead of issuing them one at a time.
                - Release remote devices when done; a remote device is a billed resource.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: cursor-mcp-mobile-mobile
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: mobile-mcp
              transport: stdio
              command: npx
              args: ['-y', '@mobilenext/mobile-mcp@latest']
          - id: cursor-mcp-mobile-appium
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: appium-mcp
              transport: stdio
              command: npx
              args: ['appium-mcp@latest']
              env:
                ANDROID_HOME: !!js "(function(){return process.env.ANDROID_HOME || (process.env.HOME + '/Library/Android/sdk');})()"
          - id: cursor-mcp-mobile-wdio
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: wdio-mcp
              transport: stdio
              command: npx
              args: ['-y', '@wdio/mcp']
              env:
                APPIUM_URL: 127.0.0.1
                APPIUM_URL_PORT: '4723'
          - id: cursor-mcp-mobile-adb
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: adb-mcp
              transport: stdio
              command: npx
              args: ['-y', '@landicefu/android-adb-mcp-server']
          - id: cursor-mcp-mobile-dart
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: dart
              transport: stdio
              command: dart
              args: ['mcp-server', '--experimental-mcp-server', '--force-roots-fallback']
          - id: cursor-mcp-mobile-perfdog
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: perfdog-mcp-tools
              transport: streamable-http
              url: https://perfdog.qq.com/mcp
              headers:
                Mcp_token: !!js "(function(){try{const fs=process.getBuiltinModule('fs');const c=JSON.parse(fs.readFileSync(process.env.HOME+'/.cursor/mcp.json','utf8'));return c.mcpServers['perfdog-mcp-tools'].headers['Mcp_token'];}catch(e){return '';}})()"
