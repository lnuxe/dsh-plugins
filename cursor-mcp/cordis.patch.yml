# Cursor MCP servers migrated from ~/.cursor/mcp.json into dsh-mcp-client rows.
#
# Scope decision (token cost): every MCP tool's full JSON schema is injected into
# the system prompt of whatever agent can see it, so servers are split by usage
# frequency instead of all registered globally:
#
#   - mobile-test preset (@local/cursor-mcp-mobile): perfdog-mcp-tools,
#     mobile-mcp, appium-mcp, wdio-mcp, adb-mcp, dart — the testing/Flutter
#     servers that only test sessions need.
#
# This mirrors Cursor's per-turn tool visibility (enabledServerIds +
# toolAllowlistByServer): the model only pays for the tools of its current agent.
#
# The streamable-http server reads its secret at load time from
# ~/.cursor/mcp.json via a `!!js` Loader expression (no secret is copied here).
