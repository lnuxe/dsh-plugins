# agent lifecycle hooks.
#
# The upstream dispatches 10 lifecycle events (PreToolUse / PostToolUse /
# UserPromptSubmit / Stop / SubagentStop / SessionStart / SessionEnd /
# PreCompact / PermissionRequest) to user scripts listed in hooks.json.
# DSH already emits the equivalent Cordis events; this plugin bridges them to
# user shell commands. Each command receives one JSON object on stdin
# ({ "hook": ..., ...payload }).
#
# PreToolUse is a GATE: its script may veto by exit code 2 or by printing
# {"permissionDecision":"deny"} — the tool then never dispatches and the model
# sees a denial reason. Every other hook is fire-and-forget (observation /
# side effects only).
- insert:
    - id: dsh-hooks
      name: '@local/dsh-hooks'
      config:
        # Hook name -> shell command. Command receives one JSON object
        # on stdin ({ "hook": ..., ...payload }).
        #   PostToolUse: "cat >> /tmp/tool-uses.jsonl"
        #   PreToolUse: "/path/to/guard.sh"
        hooks: {}
        # Enable PreToolUse veto (exit code 2 / permissionDecision=deny).
        veto: true
        # Timeout in ms for awaiting a PreToolUse hook; on timeout it allows.
        vetoTimeoutMs: 5000
